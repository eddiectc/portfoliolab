{{define "content"}}
<div class="page-header">
    <h1>{{.Title}}</h1>
</div>

<form action="{{.Action}}" method="POST" class="form">
    {{if .Error}}
    <div class="alert alert-error">{{.Error}}</div>
    {{end}}

    <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" value="{{.Name}}" required maxlength="100" placeholder="e.g. IBKR, Fidelity">
        <small>1-100 characters, must be globally unique</small>
    </div>

    {{if .SelectedPortfolioID}}
    <input type="hidden" name="portfolio_id" value="{{.SelectedPortfolioID}}">
    {{else}}
    <div class="form-group">
        <label for="portfolio_id">Portfolio</label>
        <select id="portfolio_id" name="portfolio_id" required>
            <option value="">-- Select Portfolio --</option>
            {{range .Portfolios}}
            <option value="{{.ID}}">{{.Name}}</option>
            {{end}}
        </select>
        <small>Choose the portfolio this account belongs to</small>
    </div>
    {{end}}

    <div class="form-actions">
        <button type="submit" class="btn btn-primary">{{.SubmitText}}</button>
        <a href="{{.CancelHref}}" class="btn">Cancel</a>
    </div>
</form>
{{end}}

{{template "base" .}}
