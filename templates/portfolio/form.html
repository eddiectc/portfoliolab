{{define "content"}}
<div class="page-header">
    <h1>{{.Title}}</h1>
</div>

<form action="{{.Action}}" method="POST" class="form">
    {{if .Error}}
    <div class="alert alert-error">{{.Error}}</div>
    {{end}}

    <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" value="{{.Name}}" required maxlength="100" placeholder="e.g. Tech Growth">
        <small>1-100 characters, must be unique</small>
    </div>

    <div class="form-group">
        <label for="currency">Base Currency</label>
        <select id="currency" name="currency">
            {{range .Currencies}}
            <option value="{{.}}" {{if eq . $.SelectedCurrency}}selected{{end}}>{{.}}</option>
            {{end}}
        </select>
        <small>3-letter ISO 4217 code</small>
    </div>

    <div class="form-actions">
        <button type="submit" class="btn btn-primary">{{.SubmitText}}</button>
        <a href="{{.CancelHref}}" class="btn">Cancel</a>
    </div>
</form>
{{end}}

{{template "base" .}}
