# Arch Portfolio Lab Configuration
# Copy to config/config.yaml and adjust as needed
#
# Environment variables override values from this file:
#   PORTFOLIOLAB_HOST      (default "0.0.0.0")
#   PORTFOLIOLAB_PORT      (default 8080)
#   PORTFOLIOLAB_DB_PATH   (default "data/portfoliolab.db")
#   PORTFOLIOLAB_LOG_LEVEL (default "info")

server:
  port: 8080
  host: "0.0.0.0"

database:
  path: "data/portfoliolab.db"

log:
  level: "info"  # debug, info, warn, error

extractors:
  vanguard:
    # Lookback period for NAV history extraction in days (default 730 / 2 years)
    nav_history_days: 730
